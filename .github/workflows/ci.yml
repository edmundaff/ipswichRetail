# Ipswich Retail - continuous integration (not a production deployment workflow)
name: Ipswich Retail CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-tests:
    name: Django checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Django configuration
        run: python manage.py check

      - name: Check that model migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django automated tests
        run: python manage.py test --verbosity 2

  docker-build:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag ipswich-retail:ci .

      - name: Django system check inside Docker
        run: docker run --rm -e DJANGO_DEBUG=true ipswich-retail:ci python manage.py check

      - name: Run automated tests inside Docker
        run: docker run --rm -e DJANGO_DEBUG=true ipswich-retail:ci python manage.py test
