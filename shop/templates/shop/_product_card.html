{% load static %}
<article class="product-card">
  <a class="product-media" href="{{ product.get_absolute_url }}">
    <img src="{% static 'shop/img/' %}{{ product.image_name }}" alt="Illustration of {{ product.name }}" loading="lazy">
    {% if product.is_featured %}<span class="product-badge">Best loved</span>{% endif %}
  </a>
  <div class="product-information">
    <span class="eyebrow product-category">{{ product.category.name }}</span>
    <a class="product-name" href="{{ product.get_absolute_url }}">{{ product.name }}</a>
    <div class="product-bottom"><strong>£{{ product.price }}</strong><a class="round-arrow" href="{{ product.get_absolute_url }}" aria-label="View {{ product.name }}">↗</a></div>
  </div>
</article>
